name: Update GitHub Profile Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Activity Statistics
        id: signal
        uses: shinpr/github-profile-stats@v0.2.0
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: signal-field

      - name: Copy Activity Statistics
        env:
          READY_DIR: ${{ steps.signal.outputs.ready-dir }}
        run: |
          mkdir -p profile
          cp "$READY_DIR"/signal-field-*.svg profile/

      - name: Generate Activity Consistency
        id: activity
        uses: shinpr/github-profile-stats@v0.2.0
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: activity-consistency

      - name: Copy Activity Consistency
        env:
          READY_DIR: ${{ steps.activity.outputs.ready-dir }}
        run: |
          mkdir -p profile
          cp "$READY_DIR"/activity-consistency-*.svg profile/

      - name: Generate Language Statistics
        id: languages
        uses: shinpr/github-profile-stats@v0.2.0
        with:
          username: ${{ github.repository_owner }}
          token: ${{ github.token }}
          profile: language-composition

      - name: Copy Language Statistics
        env:
          READY_DIR: ${{ steps.languages.outputs.ready-dir }}
        run: |
          mkdir -p profile
          cp "$READY_DIR"/language-composition-*.svg profile/

      - name: Commit generated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update GitHub profile statistics"
          git push
